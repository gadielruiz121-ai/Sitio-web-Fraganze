<!DOCTYPE html>
<html lang="en">
<head>
    <!-- head de la pagina, lugar donde se coloca el icono de la pagina, el nombre, autor etc -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Gadiel">
    <link rel="icon" href="assets/Imagenes/Logo.jpeg">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/reset.css">
    <title>FRAGANZE</title>

</head>
<body>

    <div class="principal">

<!-- la parte del header es el encabezado de la pagina, esta zona contiene las etiquetas de navegacion, los logos y el nombre de la pagina, y esta presente en todas las demas paginas al igual que el head y el style -->

   <header id="inicio">
        <div class="logo">

            <img src="assets/Imagenes/Logo.jpeg" alt="logo" class="logo">

        </div>

        <div class="logo">

            <img src="assets/Imagenes/Icono.svg" alt="logo" class="svg">

        </div>
        
        
        <h1>FRAGANZE</h1>
        <nav>
            <ul>
            <li><a href="index.html">Inicio</a></li>
           <li><a href="Catalogo.html">Catalogo</a></li>
           <li><a href="Formulario.html">Formulario</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- En la parte del formulario es donde se contienen los espacios para que el usuario ingrese sus datos -->

<fieldset>
    <legend>Formulario</legend>

    <form action="">

<!-- casilla de nombre -->
    <label for="">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required placeholder="Ingrese su nombre:"><br><br> 

    <!-- casilla de edad -->
    <label for="">Edad:</label>
    <input type="number" id="edad" name="edad" required min="18" max="99" value="18"><br><br>

<!-- casilla de correo -->
    <label for="">Correo:</label>
    <input type="email" id="correo" name="correo" required placeholder="Ingrese un correo electronico valido:"><br><br>
    
<!-- lista de productos con opcion de seleccionar un favorito -->
    <p>Seleccione su producto favorito</p><br>

    <input type="radio" id="Acqua Di Gio Parfum" name="favorito">
    <label for="">Acqua Di Gio Parfum</label><br>

    <input type="radio" id="Jean Paul Gaultier Le Beau Le Parfum" name="favorito">
    <label for="">Jean Paul Gaultier Le Beau Le Parfum</label><br>

    <input type="radio" id="Scandal Jean Paul Gaultier" name="favorito">
    <label for="">Scandal Jean Paul Gaultier</label><br>

    <input type="radio" id="Stronger With You Intensely" name="favorito">
    <label for="">Stronger With You Intensely</label><br>

    <input type="radio" id="Valentino Born In Roma Intense" name="favorito">
    <label for="">Valentino Born In Roma Intense</label><br><br>

    <!-- zona para dejar comentarios opcionales acerca de la pagina -->
    <p>Deja tu comentario:</p><br>
    <textarea rows="5" cols="20" placeholder="Espacio para comentario"></textarea><br><br>

    <!-- boton de envio del formulario -->
    <button type="submit">Enviar Formulario</button>

    </form>

</fieldset>
    </main>

    <footer>
        <p>&copy; Garantia de originalidad. <a href="#inicio">Volver al inicio</a></p>
    </footer>
    
</body>
</html>
